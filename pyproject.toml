[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scnehaux-linter"
version = "1.2.0"
description = "Scnehaux Architecture Documentation Governance Linter"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.0.0",
    "jsonschema>=4.20.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["06-fitness-function/tests"]
pythonpath = ["06-fitness-function/engine"]
addopts = "--cov=engine --cov-fail-under=90 --cov-report=term-missing"

[tool.coverage.run]
source = ["engine"]
omit = ["validators/tests/*"]

[tool.pyright]
extraPaths = ["06-fitness-function", "06-fitness-function/engine"]
