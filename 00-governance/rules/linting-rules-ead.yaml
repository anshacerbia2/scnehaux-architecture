
# ==============================================================================
# WARNING: AUTOMATED DOCUMENTATION LINKAGE
# ==============================================================================
# This YAML file is the Single Source of Truth (SSOT). If you modify any rules
# below, you MUST regenerate the Markdown table in the respective GDC document:
#   > python scripts/generate_rules_doc.py   (CI verifies via --check)
# ==============================================================================
#
# EAD = C1 Enterprise (the "Bappenas" layer): principles & strategy, enterprise-wide
# and implementation-agnostic. Sections are PER BDAT FILE (Business/Data/Application/
# Technology), because each EAD file is already a specific TOGAF domain.
#
# Altitude rule: if a section names a specific system / API / topology, it has leaked
# down to PAD/SAD. Keep `Data Flow Landscape` and `Application Interaction` MACRO.
# Note (going-forward intent, see GDC-007): `Technology Standards` should reference
# the STD layer (no duplicate SSOT); `Organization Model` should express team-topology
# principles, not a volatile org chart.
config:
  target_doc: GDC-007-ead-guideline.md

rules:
  metadata:
    required_fields:
    - id
    - title
    - governed_by
    - owner
    - version
    - status
    - classification
    - review_cycle_days
    - last_reviewed
    allowed_statuses:
    - proposed
    - approved
    - deprecated
    allowed_classifications:
    - public
    - internal
    - restricted
  structure:
    # Per-id required sections: EADValidator resolves the set whose key matches the filename.
    required_sections:
      EAD-001:
      - Vision
      - Mission
      - Strategic Objectives
      - Business Capability Map
      - Value Stream
      - Operating Model
      - Team Topology Principles
      - Stakeholder
      EAD-002:
      - Enterprise Data Principles
      - Master Data
      - Data Ownership
      - Data Classification
      - Data Governance
      - Data Lifecycle
      - Data Flow Landscape
      EAD-003:
      - Application Portfolio
      - Application Interaction
      - Application Classification
      - Build vs Buy
      - Enterprise Integration Strategy
      EAD-004:
      - Cloud Strategy
      - Security Principles
      - Observability Principles
      - Platform Strategy
      - Technology Principles
      - Technology Radar
