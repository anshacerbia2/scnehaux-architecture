    - approved
    - deprecated
    allowed_classifications:
    - public
    - internal
    - restricted
  structure:
    required_sections:
    - Business Capability
    - Trust Boundary & Security
    - Integration Contract
    - Strategic Architecture
    - Quality Attributes
    optional_sections:
    - Assumptions
    - Alternatives Considered
    - Data Classification
    - Document Lifecycle & Statuses
