
# ==============================================================================
# WARNING: AUTOMATED DOCUMENTATION LINKAGE
# ==============================================================================
# This YAML file is the Single Source of Truth (SSOT). If you modify any rules
# below, you MUST regenerate the Markdown table in the respective GDC document:
#   > python scripts/generate_rules_doc.py   (CI verifies via --check)
# ==============================================================================
#
# PAD = C2 logical charter (one per product/platform). Sections are the fitness
# functions for the PAD philosophy; required_section_keywords enforce the essential
# SUB-CONTENT of each section (suffix-tolerant), and the NFR section must be quantified.
config:
  target_doc: GDC-009-pad-guideline.md

rules:
  metadata:
    required_fields:
    - id
    - title
    - governed_by
    - owner
    - version
    - status
    - classification
    - fulfilled_by
    - review_cycle_days
    - last_reviewed
    allowed_statuses:
    - proposed
    - approved
    - deprecated
    allowed_classifications:
    - public
    - internal
    - restricted
  structure:
    required_sections:
    - Context & Scope
    - Business Capability
    - Domain Model
    - Trust & Data Boundaries
    - Integration Contracts
    - Capability NFR Targets
    - Ownership & Realizing Systems
    optional_sections:
    - Assumptions
    - Alternatives Considered
  content:
    # Sub-section enforcement: each required section must cover its essential sub-content.
    # Matching is suffix-tolerant (e.g. 'Domain Event' satisfies 'Domain Events').
    # Universal essential sub-content (applies to any PAD type — service domain OR
    # library/platform). Type-specific items (Domain Event, External Systems, specific
    # NFR metrics) stay as TEMPLATE guidance in GDC-009, not hard-enforced here.
    required_section_keywords:
      Context & Scope:
      - Purpose
      - Goals
      - Non-Goal
      - Stakeholder
      Business Capability:
      - Capability
      - Maturity
      Domain Model:
      - Bounded Context
      - Context Mapping
      Trust & Data Boundaries:
      - Trust
      - Data
      - Compliance
      Integration Contracts:
      - API
      - Consumer
      - Dependencies
      Ownership & Realizing Systems:
      - Owner
      - fulfilled_by
    # Type-specific sub-content (the full discussed list): validated as non-blocking
    # WARNINGs — address where applicable, or mark Not Applicable.
    recommended_section_keywords:
      Domain Model:
      - Domain Event
      Trust & Data Boundaries:
      - Identity
      Integration Contracts:
      - Event
      - Provider
      - External
      Capability NFR Targets:
      - Availability
      - Scalability
      - Resilience
      - Performance
  quantification:
    # The NFR section must contain quantified targets (numbers + units), not prose.
    required_for_sections:
    - Capability NFR Targets
