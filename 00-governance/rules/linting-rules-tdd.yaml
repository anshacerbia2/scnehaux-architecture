    - id
    - title
    - owner
    - version
    - status
    - classification
    - parent_sad
    - review_cycle_days
    - last_reviewed
    allowed_statuses:
    - proposed
    - approved
    - deprecated
    allowed_classifications:
    - public
    - internal
    - restricted
  structure:
    required_sections:
    - Context & Requirements
    - Design Details
    - API / Schema Contracts
    - Security & Privacy
    - Failure Handling
    - Observability
    - Testing Strategy
    - Rollout Strategy
    optional_sections:
    - Alternatives Considered
    - Compatibility Strategy
    - Document Lifecycle & Statuses
