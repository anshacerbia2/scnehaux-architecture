
# ==============================================================================
# ⚠️ WARNING: AUTOMATED DOCUMENTATION LINKAGE ⚠️
# ==============================================================================
# This YAML file is the Single Source of Truth (SSOT). If you modify any rules
# below, you MUST regenerate the Markdown table in the respective GDC document.
# 
# Run this command from the scnehaux-architecture root directory:
# > python scripts/generate_rules_doc.py
# ==============================================================================
config:
  target_doc: GDC-006-gdc-guideline.md

rules:
  metadata:
    filename_pattern: ^GDC-\d{3}-[a-z0-9-]+\.md$
    required_fields:
    - id
    - title
    - governed_by
    - owner
    - version
    - status
    - classification
    - review_cycle_days
    - last_reviewed
    optional_fields:
    - tags
    - aliases
    - contributors
    version_format: semver
    allowed_classifications:
    - public
    - internal
    - restricted
    - confidential
    allowed_statuses:
    - approved
    - draft
  structure:
    required_sections:
    - Context & Scope
    - Policy Framework
    optional_sections:
    - Enforcement Mechanism
    - Enforcement Mechanism & Rule Reconciliation
    - Severity & Exceptions
    - Document Types (Glossary of Truth)
    - Document Lifecycle & State Management
    - Linter Execution Flow (CI/CD Automated Gate)
    - Compliance & Enforcement
    - The Git Workflow & Access Control
    - The Reconciliation Flow (Adding or Modifying Rules)
    - Directory Structure & Taxonomy
    - Directory Structure & Naming Conventions
    - Document Template Schema (Metadata Frontmatter)
    - Document Section Semantics
    - Metadata Schema Properties
    - Semantic Definitions
    - Allowed Lifecycle Statuses
    - Allowed Classifications
    - Semantic Versioning Classification
    - "Appendix: Architectural Clarifications & Trade-Offs"
    - "Appendix: Architectural Trade-Offs"
    required_downstream_guideline_subsections:
      "Semantic Definitions":
      - Naming Conventions
      - Taxonomy
      - Directory Structure
      - Metadata Schema Properties
      - Document Section
      "Metadata Schema Properties":
      - Allowed Lifecycle Statuses
      - Allowed Classifications
      - Semantic Versioning Classification
