# Scnehaux Architecture Documentation Linter Rules
# Ruleset Version: 1.1.0
# Last Updated: 2026-06-24
# Changelog:
#   1.0.0 - Initial release
#   1.1.0 - Fixed dead ambiguity regex (YAML double-quote \b -> backspace bug);
#           de-leaked metric pattern (trailing word boundary); curated prohibited
#           words to remove proper-noun collisions; added duplicate_id and
#           inline_reference_missing; documented traceability/hold/draft severities.
# Description: Configuration for the automated documentation audit pipeline.
# Note: This is the active core global ruleset.
#
# ==============================================================================
# WARNING: AUTOMATED DOCUMENTATION LINKAGE
# ==============================================================================
# This YAML file is the Single Source of Truth (SSOT). If you modify any rules
# below, you MUST regenerate the Markdown table in GDC-001:
#   > python scripts/generate_rules_doc.py
# CI enforces synchronization via:
#   > python scripts/generate_rules_doc.py --check
# ==============================================================================

config:
  target_doc: GDC-001-compliance-engine.md

rules:
  # Structural Validation
  structure:
    min_content_length_chars: 50

  # Content Quality (Semantic Linting)
  content:
    # Words removed if they collide with legitimate technical proper nouns
    # (e.g. "Simple Storage Service", "Basic Auth", "Just-In-Time"). Retained
    # terms are genuine weasel words that rarely appear in product/protocol names.
    prohibited_words:
    - maybe
    - probably
    - should consider
    - TBD
    - coming soon
    - and so on
    - seamless
    - seamlessly
    - obviously
    - blazingly
    - trivially
    ambiguity_check:
      # MUST be single-quoted. In a DOUBLE-quoted YAML scalar, \b is parsed as a
      # backspace (0x08) control char, silently breaking the word boundary so the
      # pattern matches nothing. Single quotes keep backslashes literal.
      pattern: '\b(highly|very|extremely|super|incredibly)\s+(scalable|fast|secure|reliable|available|performant|robust|efficient)\b'
      message: Vague claim detected. Must be quantified with metrics.

  # Quantification Rules
  quantification:
    required_for_sections:
    - Non-Functional Requirements
    - Observability Requirements
    # Trailing (?!\w) prevents incidental prose ("3 services", "5 systems") from being
    # accepted as a metric, while still allowing non-word units like '%'. A bare \b
    # would FAIL after '%' (a non-word char), wrongly rejecting "99.95%".
    metric_pattern: '\d+(\.\d+)?\s*(ns|us|ms|s|m|h|d|%|req/s|rps|qps|rpm|kb|mb|gb|tb|pb|seconds?|milliseconds?|minutes?|hours?|days?|nines)(?!\w)'

  # Governance Policy
  governance:
    max_review_age_days: 365
    max_draft_age_days: 30
    require_adr_links: true
    naming_conventions:
      global_adr_pattern: ^ADR-GLB-(?:[A-Z]{2,4}-)?\d{3}-[a-z0-9-]+\.md$
      domain_adr_pattern: ^ADR-[A-Z]{2,4}(?:-[A-Z]{2,4})?-\d{3}-[a-z0-9-]+\.md$
      global_std_pattern: ^STD-GLB-(?:[A-Z]{2,4}-)?\d{3}-[a-z0-9-]+\.md$
      domain_std_pattern: ^STD-[A-Z]{2,4}(?:-[A-Z]{2,4})?-\d{3}[A-Za-z]?-[a-z0-9-]+\.md$
      pad_pattern: ^[a-z0-9-]+\.pad\.md$
      sad_pattern: ^[a-z0-9-]+\.sad\.md$
      gdc_pattern: ^GDC-\d{3}-[a-z0-9-]+\.md$
      ead_pattern: ^EAD-\d{3}-[a-z0-9-]+\.md$

# Three-Gate CI Rule Categorization (Hard Block Exit 1 vs Non-Blocking Warning)
severity_levels:
  # BLOCKING (Hard Gate - CI fails with Exit 1)
  security_isolation_violation: CRITICAL
  structural_integrity_violation: CRITICAL
  technology_hold_violation: CRITICAL
  operational_stability_violation: ERROR
  missing_metadata: ERROR
  missing_section: ERROR
  missing_section_keyword: ERROR
  exception_expired: ERROR
  missing_exception_reason: ERROR
  traceability_violation: ERROR
  draft_expired: ERROR
  duplicate_id: ERROR

  # NON-BLOCKING (Soft Gate - PR Warning only)
  unrecognized_section: WARNING
  cross_reference_missing: WARNING
  inline_reference_missing: WARNING
  recommended_keyword_missing: WARNING
  prohibited_word: WARNING
  vague_claim: WARNING
  old_review: WARNING
  stylistic_deviation: WARNING
  naming_style_deviation: WARNING
  onboarding_complexity_untracked: WARNING
