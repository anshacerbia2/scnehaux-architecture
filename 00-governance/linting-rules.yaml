# Scnehaux Architecture Documentation Linter Rules
# Version: 1.0.0
# Description: Configuration for the automated documentation audit pipeline.

rules:
  # Metadata Validation
  metadata:
    required_fields:
      - id
      - title
      - version
      - status
      - classification
    adr_required_fields:
      - id
      - title
      - adr_type
      - status
      - created
      - created_by
    version_format: semver
    allowed_classifications:
      - public
      - internal
      - restricted
      - confidential
    allowed_adr_statuses:
      - proposed
      - accepted
      - rejected
      - superseded
      - deprecated
    allowed_adr_types:
      - foundational
      - implementation
      - exception
      - conflict_resolution
      - replacement

  # Structural Validation
  structure:
    gdc_sections:
      - Context & Scope
      - Policy Framework
      - Enforcement Mechanism
      - Severity & Exceptions
    ead_sections:
      - Context & Business Drivers
      - Enterprise Principles
      - Strategic Architecture
      - Cross-Cutting Standards
      - Decision Log
    pad_sections:
      - Application Capability
      - Trust Boundary & Security
      - Integration Contract
      - Strategic Architecture
      - Quality Attributes
    pad_optional_sections:
      - Assumptions
      - Alternatives Considered
      - Data Classification
    sad_sections:
      - Context
      - Solution Architecture
      - Deployment & Topology
      - Runtime Flows
      - Resilience & Failure Modes
      - Observability
      - Security Considerations
    sad_optional_sections:
      - Assumptions
      - Alternatives Considered
      - Compatibility Strategy
      - Data Classification
    tdd_sections:
      - Context & Requirements
      - Design Details
      - API / Schema Contracts
      - Security & Privacy
      - Failure Handling
      - Observability
      - Testing Strategy
      - Rollout Strategy
    tdd_optional_sections:
      - Alternatives Considered
      - Compatibility Strategy
    adr_sections:
      - Title
      - Status
      - Context
      - Decision Drivers
      - Decision
      - Consequences
      - Compliance Impact
      - Alternatives Considered
    std_sections:
      - Objective & Scope
      - Design Principles
      - Normative Rules
      - Exceptions
      - Enforcement Mechanism
    min_content_length_chars: 50 # Prevent empty sections

  # Content Quality (Semantic Linting)
  content:
    prohibited_words:
      - maybe
      - probably
      - should consider
      - TBD
      - coming soon
      - and so on
      - easy
      - simple
      - just
      - basic
      - good
      - better
    ambiguity_check:
      pattern: "\b(highly|very) (scalable|fast|secure)\b"
      message: "Vague claim detected. Must be quantified with metrics."
    required_section_keywords:
      "Resilience":
        - "Blast Radius"
    prohibited_section_keywords:
      "Exceptions":
        - "waiver"
        - "ADR"
        - "ARB"
        - "Approval Requirements"

  # Quantification Rules
  quantification:
    required_for_sections:
      - Non-Functional Requirements
      - Observability Requirements
    metric_pattern: "\\d+(ms|s|%|req/s|GB|TB)"

  # Governance Policy
  governance:
    max_review_age_days: 365
    require_adr_links: true

  # Federated Governance Namespace & Exception Validation
  federated_governance:
    exception_meta_fields:
      - owner
      - approved_by
      - expiry_date
      - risk_classification
      - exception_reason
    naming_conventions:
      global_adr_pattern: "^ADR-GLB-(?:[A-Z]{2,4}-)?\\d{3}-[a-z0-9-]+\\.md$"
      domain_adr_pattern: "^ADR-[A-Z]{2,4}(?:-[A-Z]{2,4})?-\\d{3}-[a-z0-9-]+\\.md$"
      global_std_pattern: "^STD-GLB-(?:[A-Z]{2,4}-)?\\d{3}-[a-z0-9-]+\\.md$"
      domain_std_pattern: "^STD-[A-Z]{2,4}(?:-[A-Z]{2,4})?-\\d{3}[A-Za-z]?-[a-z0-9-]+\\.md$"

# Three-Gate CI Rule Categorization (Hard Block Exit 1 vs Non-Blocking Warning)
severity_levels:
  # Gate 1: Security & Data Isolation violations (Hard Gate - Exit 1)
  security_isolation_violation: CRITICAL

  # Gate 2: Structural Integrity & CQRS Boundary violations (Hard Gate - Exit 1)
  structural_integrity_violation: CRITICAL

  # Gate 3: Operational Stability & Critical Metadata (Hard Gate - Exit 1)
  operational_stability_violation: ERROR
  missing_metadata: ERROR
  missing_section: ERROR
  missing_section_keyword: ERROR
  unrecognized_section: WARNING
  exception_expired: ERROR
  missing_exception_reason: ERROR
  cross_reference_missing: WARNING

  # Non-Blocking Warnings (Soft Gate - PR Warning only)
  prohibited_word: WARNING
  vague_claim: WARNING
  old_review: WARNING
  stylistic_deviation: WARNING
  naming_style_deviation: WARNING
  onboarding_complexity_untracked: WARNING
