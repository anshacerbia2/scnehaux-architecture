name: "Scnehaux Architecture - Internal CI"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write   # required to upload SARIF results to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-lint:
    name: "Enforce GDC Compliance (Self-Dogfooding)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Dependencies
        run: pip install -e .[dev]

      - name: Run Validator Tests & Coverage Enforcer (>=94%)
        run: python -m pytest --cov=validators --cov=linter --cov-fail-under=94 --cov-report=term-missing

      - name: Verify Rules-Doc Sync (SSOT reconciliation)
        run: |
          python 06-fitness-function/generators/generate_rules_doc.py
          git diff --exit-code 00-governance/GDC-002-compliance-engine.md || (echo "GDC-002 is out of sync with linting-rules.yaml. Run 06-fitness-function/generators/generate_rules_doc.py locally and commit the result." && exit 1)

      - name: Verify ADR Index Sync
        run: |
          python 06-fitness-function/generators/generate_adr_index.py
          git diff --exit-code 05-decisions/INDEX.md || (echo "ADR INDEX is out of sync. Run 06-fitness-function/generators/generate_adr_index.py locally and commit." && exit 1)

      - name: Verify PAD/SAD Index Sync
        run: |
          python 06-fitness-function/generators/generate_pad_sad_index.py
          git diff --exit-code 03-platform/INDEX.md 04-application/INDEX.md || (echo "PAD/SAD INDEX is out of sync. Run 06-fitness-function/generators/generate_pad_sad_index.py locally and commit." && exit 1)

      - name: Verify Waiver Expirations
        run: python 06-fitness-function/scripts/waiver-expiry-check.py

      - name: Generate SARIF report
        if: always()
        run: python linter.py --format sarif > linter.sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: linter.sarif
        continue-on-error: true

      - name: Enforce Compliance Gate (authoritative)
        run: python linter.py --format text

