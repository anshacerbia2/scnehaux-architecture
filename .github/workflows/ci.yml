name: "Scnehaux Architecture - Internal CI"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write   # required to upload SARIF results to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-lint:
    name: "Enforce GDC Compliance (Self-Dogfooding)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Dependencies
        run: pip install -c constraints.txt -e .[dev]

      - name: Enforce Compliance Gate (fail-fast)
        run: make lint

      - name: Run Validator Tests & Coverage Enforcer (>=95%)
        run: make test

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Code and Documentation Formatting
        run: |
          make lint-code
          make lint-docs-format

      - name: Verify Generators Sync (SSOT reconciliation)
        run: make verify-generated

      - name: Verify Waiver Expirations
        run: make check-waivers

      - name: Validate CODEOWNERS paths
        run: python 06-fitness-function/scripts/codeowners-validator.py

      - name: Generate SARIF report
        if: always()
        run: make lint-sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: linter.sarif
        continue-on-error: true



