name: Align parked Notification resolution

on:
  push:
    branches: [arch/harden-identity-notification-scheduling]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/harden-identity-notification-scheduling
      - shell: python
        run: |
          from pathlib import Path

          p = Path('03-domain/PAD-PLT-005-notification-platform/PAD-PLT-005-notification-platform.pad.md')
          s = p.read_text()
          old = '    Parked --> [*]'
          new = '''    Parked --> Ready: governed resolution proves effect absent / retry safe
    Parked --> ProviderAccepted: governed evidence proves acceptance
    Parked --> Delivered: governed evidence proves delivery
    Parked --> PermanentFailure: governed evidence proves terminal no-delivery'''
          assert old in s
          s = s.replace(old, new, 1)
          old2 = '- `Parked` is an explicit operational state for ambiguity that cannot be safely resolved automatically; it is not fabricated success or failure.'
          new2 = '- `Parked` stops automatic retry/failover. It can leave that state only through an attributable governed resolution whose evidence proves a safe retry or a stronger normalized outcome; it is not fabricated success or failure.'
          assert old2 in s
          p.write_text(s.replace(old2, new2, 1))

          p = Path('04-system/scnehaux-notification-platform/scnehaux-notification-platform.sad.md')
          s = p.read_text()
          old = '    Reconciling --> Parked\n\n    Retryable --> Claimed'
          new = '''    Reconciling --> Parked

    Parked --> Retryable: governed evidence proves effect absent / retry safe
    Parked --> ProviderAccepted: governed evidence proves acceptance
    Parked --> Delivered: governed evidence proves delivery
    Parked --> PermanentRejected: governed evidence proves terminal no-delivery

    Retryable --> Claimed'''
          assert old in s
          s = s.replace(old, new, 1)
          old2 = '- non-reconcilable ambiguity is parked for bounded policy/operator resolution instead of fabricated success/failure;'
          new2 = '- non-reconcilable ambiguity is parked and excluded from automatic retry/failover; only an attributable governed resolution with evidence may reopen it or advance it to a proven normalized state;'
          assert old2 in s
          p.write_text(s.replace(old2, new2, 1))
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes prettier@3.9.6 --write 03-domain/PAD-PLT-005-notification-platform/PAD-PLT-005-notification-platform.pad.md 04-system/scnehaux-notification-platform/scnehaux-notification-platform.sad.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03-domain/PAD-PLT-005-notification-platform/PAD-PLT-005-notification-platform.pad.md 04-system/scnehaux-notification-platform/scnehaux-notification-platform.sad.md
          git commit -m 'fix(notification): clarify governed parked outcome resolution'
          git push origin HEAD:arch/harden-identity-notification-scheduling
