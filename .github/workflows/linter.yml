name: "Scnehaux Architecture Linter (Reusable)"

on:
  workflow_call:
    inputs:
      target_dir:
        description: "The directory to scan for architecture documents in the downstream repository."
        required: false
        default: "docs"
        type: string
      governance_ref:
        description: "The specific ref (branch, tag, sha) of the governance repository to use."
        required: false
        default: "main"
        type: string

jobs:
  # TEMPORARILY DISABLED.
  #
  # Two parallel rewrites of the governance layer diverged from 928014f, and merging them
  # produces a tree with two ADR-IAM-001 and two ADR-ORG-001 documents plus two directory
  # conventions. Every downstream repository calls this workflow at @main, so leaving
  # enforcement on would fail seven repositories for a state nobody has decided yet.
  #
  # Disabled here rather than in each caller: one switch, and the seven `architecture.yml`
  # files stay correct so re-enabling is deleting this condition rather than editing seven
  # repositories back.
  #
  # RE-ENABLE by removing the `if: false` below, once the duplicate identifiers are resolved.
  lint-architecture:
    name: "Enforce GDC Compliance"
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Downstream Repository
        uses: actions/checkout@v4

      - name: Checkout Architecture Governance Repository
        uses: actions/checkout@v4
        with:
          repository: anshacerbia2/scnehaux-architecture
          ref: ${{ inputs.governance_ref }}
          path: .scnehaux-governance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linter Package
        run: pip install .scnehaux-governance

      - name: Execute Governance Engine
        run: PYTHONPATH=.scnehaux-governance/06-fitness-function python .scnehaux-governance/06-fitness-function/engine/cli.py --target ${{ inputs.target_dir }}

