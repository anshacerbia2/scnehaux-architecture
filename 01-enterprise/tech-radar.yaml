# tech-radar.yaml — Enterprise Technology Radar
# Governed by: GDC-004 (Technology Lifecycle & Standards Governance)
# Owner: Architecture Authority
# Last updated: 2026-10-02
#
# Ring changes are ARB decisions (GDC-004 section 3.2). Entries marked
# "pending ARB" were proposed with the UI Platform ratification package on
# 2026-09-28 and take effect only when the ARB records the transition.

technology_radar:
  adopt:
    - name: postgresql
      category: database
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null # Foundational — predates ADR framework

    - name: react
      category: frontend-framework
      date_adopted: "2025-03-01"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-001

    - name: golang
      category: backend-language
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null

    - name: kubernetes
      category: orchestration
      date_adopted: "2025-01-15"
      owner: Platform Team
      rationale_adr: null

    - name: aws
      category: cloud-provider
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null

    # The JVM/Quarkus runtime enters the portfolio with this entry and is scoped to
    # it. EAD-005 section 5.3 keeps it out of the general server-side options, so it
    # carries no radar entry of its own.
    - name: keycloak
      category: identity-kernel
      date_adopted: "2026-08-11"
      owner: Identity Platform Team
      rationale_adr: ADR-IAM-001

    # Messaging technologies are adopted by semantic profile rather than as universal
    # dependencies. A deployment runs only the substrate required by its contracts.
    - name: kafka
      category: event-streaming-broker
      date_adopted: "2026-08-21"
      owner: Platform Engineering
      rationale_adr: ADR-GLB-016

    - name: rabbitmq
      category: queue-broker
      date_adopted: "2026-08-24"
      owner: Platform Engineering
      rationale_adr: ADR-GLB-016

    - name: atlas
      category: schema-migration
      date_adopted: "2026-08-21"
      owner: Platform Engineering
      rationale_adr: ADR-GLB-004

    - name: opentelemetry
      category: observability
      date_adopted: "2026-08-21"
      owner: Platform Engineering
      rationale_std: STD-GLB-003

    - name: rsbuild
      category: frontend-build-tool
      date_adopted: "2026-04-07"
      owner: UI Platform Team
      # ADR-GLB-FE-002 was superseded by ADR-GLB-FE-011 (accepted 2026-09-29),
      # which keeps Rsbuild as one Rspack-based toolchain for federated apps.
      rationale_adr: ADR-GLB-FE-011

    - name: vitest
      category: test-runner
      date_adopted: "2026-05-01"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-007

    - name: playwright
      category: browser-test-runner
      date_adopted: "2026-05-01"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-007

  trial:
    - name: rust
      category: systems-language
      date_entered: "2026-03-01"
      owner: Platform Team
      rationale_adr: null
      trial_end_date: "2026-09-01"

    - name: surrealdb
      category: database
      date_entered: "2026-04-01"
      owner: AI Team
      rationale_adr: null
      trial_end_date: "2026-10-01"

    - name: oklch
      category: color-space
      date_entered: "2026-02-01"
      owner: UI Platform Team
      rationale_adr: ADR-UIP-TKN-002
      # ARB decision 2026-10-02 (Ansha Cerbia): trial extended from 2026-08-01
      # to 2026-12-31; not adopted. Adoption criteria: the P1 browser support
      # matrix is declared; the packed token and component fixtures pass in
      # Chromium, Firefox, and WebKit (STD-UIP-STY-001, STD-UIP-ENG-001); a
      # named Product consumer runs the OKLCH tokens in production; ARB vote.
      # Basis and sources (web-features Baseline, GDC-004 2.1-2.2): ui-platform
      # docs/reviews/2026-10-02-p0-exit-review.md, "D2 recommendation: oklch".
      trial_end_date: "2026-12-31"

    # ARB decision 2026-10-02 (D2): sass and panda-css stay trial with the
    # trial extended; tsup moves to hold. Basis and sources: ui-platform docs/reviews/2026-10-02-d2-arb-recommendations.md.
    - name: sass
      category: css-preprocessor
      date_entered: "2026-09-28"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-013
      # Adoption criteria: a named Product consumer in production and no
      # deprecated Sass API in use (@import is deprecated since Dart Sass 1.80.0).
      trial_end_date: "2026-12-31"

    - name: panda-css
      category: css-generator
      date_entered: "2026-09-28"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-013
      # On 1.x. Condition: evaluate the v2 migration (ESM only, Node 22) before
      # the trial ends; generated recipe CSS must stay byte-identical, and the
      # postcss and browserslist overrides must become removable.
      trial_end_date: "2026-12-31"

    # ARB decision 2026-10-02 (D2): storybook and chromatic stay trial with
    # ADR-UIP-WKS-001 accepted; chromatic depends on TurboSnap (snapshot quota).
    - name: storybook
      category: component-workshop
      date_entered: "2026-10-01"
      owner: UI Platform Team
      rationale_adr: ADR-UIP-WKS-001
      trial_end_date: "2026-12-31"

    - name: chromatic
      category: visual-regression-service
      date_entered: "2026-10-01"
      owner: UI Platform Team
      rationale_adr: ADR-UIP-WKS-001
      trial_end_date: "2026-12-31"

    # ARB decision 2026-10-02 (D2): cyclonedx and github-artifact-attestations
    # stay trial with ADR-UIP-SEC-001 accepted.
    - name: cyclonedx
      category: sbom-format
      date_entered: "2026-10-02"
      owner: UI Platform Team
      rationale_adr: ADR-UIP-SEC-001
      trial_end_date: "2026-12-31"

    - name: github-artifact-attestations
      category: provenance-service
      date_entered: "2026-10-02"
      owner: UI Platform Team
      rationale_adr: ADR-UIP-SEC-001
      trial_end_date: "2026-12-31"

    - name: vite
      category: frontend-build-tool
      date_entered: "2026-04-07"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-011
      # Permitted for non-federated applications and libraries by ADR-GLB-FE-011
      # section 5 item 2 (superseding ADR-GLB-FE-002). ARB decision 2026-10-02
      # (D2): trial extended; used only for Vitest and Storybook so far, and a
      # candidate in the tsup successor assessment.
      trial_end_date: "2026-12-31"

  assess:
    - name: wasm
      category: runtime
      date_entered: "2026-05-01"
      owner: Platform Team

    - name: bun
      category: javascript-runtime
      date_entered: "2026-06-01"
      owner: UI Platform Team

    - name: module-federation
      category: frontend-architecture
      date_entered: "2026-01-15"
      owner: UI Platform Team
      # Remains assess. ADR-GLB-FE-011 constrains the toolchain only when a
      # bounded SAD/ADR separately authorizes federation; ADR-GLB-FE-012 defines
      # the evaluation contract. Neither ADR promotes this radar entry. A ring
      # transition requires the P0 federation/CSP fixture evidence and a separate
      # recorded ARB decision.

    # ARB decision 2026-10-02 (D2): assess. ADR-GLB-FE-011 names @rspack/core
    # with its Module Federation plugin as a federated toolchain; the UI
    # Platform uses it only in the P0 federation evaluation fixture, so it
    # moves only with module-federation.
    - name: rspack
      category: frontend-build-tool
      date_entered: "2026-10-02"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-011

    # ARB decision 2026-10-02 (D2): react-aria, dtcg-design-tokens, and tsdown
    # are assess, each with an exit condition. Basis and sources: ui-platform docs/reviews/2026-10-02-d2-arb-recommendations.md.
    - name: react-aria
      category: accessibility-library
      date_entered: "2026-09-28"
      owner: UI Platform Team
      # Not used. Evaluate only when a primitive needs a composite widget the
      # platform does not provide (TDD primitives).

    - name: dtcg-design-tokens
      category: interchange-standard
      date_entered: "2026-09-28"
      owner: UI Platform Team
      # Format Module 2025.10 is a stable Final Community Group Report, not a
      # W3C Standard. Move to trial when the DTCG generator passes full output
      # parity (TDD tokens).

    - name: tsdown
      category: javascript-build-tool
      date_entered: "2026-10-02"
      owner: UI Platform Team
      # Candidate successor to tsup (official Rolldown project, still 0.x),
      # assessed against Vite library mode on the packaging gates. The successor
      # decision record is due within 30 days of tsup's hold (GDC-004 2.2).

  hold:
    # ARB decision 2026-10-02 (D2): tsup's README states "This project is not
    # actively maintained anymore" and recommends tsdown. GDC-004 2.2 sunset:
    # successor decision record due 2026-11-01; grace window ends 2027-03-31.
    - name: tsup
      category: javascript-build-tool
      date_hold: "2026-10-02"
      sunset_date: "2027-03-31"
      successor: null # decided by the successor record (tsdown or vite, under assessment)
      migration_guide: null # due 2026-11-01 with the successor record
      owner: UI Platform Team
      rationale_adr: ADR-UIP-BLD-001

    - name: angularjs
      category: frontend-framework
      date_hold: "2025-06-01"
      sunset_date: "2025-12-01"
      successor: react
      migration_guide: STD-GLB-002
      owner: Architecture Authority

    - name: jquery
      category: frontend-library
      date_hold: "2025-06-01"
      sunset_date: "2025-12-01"
      successor: react
      migration_guide: STD-GLB-002
      owner: Architecture Authority

    - name: oracle-db
      category: database
      date_hold: "2025-03-01"
      sunset_date: "2025-09-01"
      successor: postgresql
      migration_guide: null
      owner: Architecture Authority

    - name: svn
      category: version-control
      date_hold: "2025-01-15"
      sunset_date: "2025-07-15"
      successor: git
      migration_guide: null
      owner: Architecture Authority

    - name: cvs
      category: version-control
      date_hold: "2025-01-15"
      sunset_date: "2025-07-15"
      successor: git
      migration_guide: null
      owner: Architecture Authority

    - name: memcached
      category: caching
      date_hold: "2026-01-01"
      sunset_date: "2026-07-01"
      successor: redis
      migration_guide: null
      owner: Platform Team
