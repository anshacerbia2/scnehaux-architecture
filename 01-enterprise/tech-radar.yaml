# tech-radar.yaml — Enterprise Technology Radar
# Governed by: GDC-004 (Technology Lifecycle & Standards Governance)
# Owner: Architecture Authority
# Last updated: 2026-08-18

technology_radar:
  adopt:
    - name: postgresql
      category: database
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null # Foundational — predates ADR framework

    - name: react
      category: frontend-framework
      date_adopted: "2025-03-01"
      owner: UI Platform Team
      rationale_adr: ADR-GLB-FE-001

    - name: golang
      category: backend-language
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null

    - name: kubernetes
      category: orchestration
      date_adopted: "2025-01-15"
      owner: Platform Team
      rationale_adr: null

    - name: aws
      category: cloud-provider
      date_adopted: "2025-01-15"
      owner: Architecture Authority
      rationale_adr: null

    # The identity kernel. Adopted rather than built: EAD-006 centralises identity, and an
    # authentication engine, session engine, credential store, and OIDC provider written
    # in-house would be the weakest security link the enterprise owns.
    - name: keycloak
      category: identity-provider
      date_adopted: "2026-08-18"
      owner: Identity Team
      rationale_adr: ADR-IAM-001

    # The event backbone. ADR-GLB-003 fixes the protocol rather than a distribution, so a
    # managed service and a single-binary local broker are both conformant.
    - name: kafka
      category: event-broker
      date_adopted: "2026-08-18"
      owner: Integration Team
      rationale_adr: ADR-GLB-003

    # Declarative schema management. The destructive gate it was adopted for now runs
    # partly outside the tool, per ADR-GLB-004 §5.1.
    - name: atlas
      category: schema-migration
      date_adopted: "2026-08-18"
      owner: Architecture Authority
      rationale_adr: ADR-GLB-004

    # Vendor-neutral instrumentation, mandated by STD-GLB-003.
    - name: opentelemetry
      category: observability
      date_adopted: "2026-08-18"
      owner: SRE Team
      rationale_adr: null

  trial:
